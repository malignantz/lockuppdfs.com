<!doctype html>
<!-- The LockUpPDFs share image (1200x630). scripts/make-lockup-art.mjs renders it to static-lockup/og.png. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
	@font-face { font-family: Geist; font-weight: 400; src: url('../../src/lib/site/fonts/geist-400.woff2') format('woff2'); }
	@font-face { font-family: Geist; font-weight: 700; src: url('../../src/lib/site/fonts/geist-700.woff2') format('woff2'); }
	* { margin: 0; box-sizing: border-box; }
	html, body { width: 1200px; height: 630px; }
	body {
		position: relative;
		overflow: hidden;
		font-family: Geist, sans-serif;
		color: #0b0d12;
		background:
			radial-gradient(900px 560px at 92% 8%, rgb(30 61 245 / 0.12), transparent 70%),
			#ffffff;
	}
	.dots {
		position: absolute;
		right: -40px; top: 40px;
		width: 620px; height: 560px;
		background: radial-gradient(circle, rgb(11 13 18 / 0.16) 1.2px, transparent 1.8px) 0 0 / 22px 22px;
		mask-image: radial-gradient(circle at 50% 50%, #000 25%, transparent 68%);
	}
	.copy { position: absolute; left: 84px; top: 92px; }
	.pill {
		display: inline-flex; align-items: center; gap: 10px;
		padding: 9px 18px 9px 14px;
		border: 1.5px solid #d5dcff; border-radius: 999px; background: #eef1ff;
		color: #1e3df5; font-size: 24px; font-weight: 700; letter-spacing: -0.01em;
	}
	.pill i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
	h1 { margin-top: 34px; font-size: 112px; font-weight: 700; line-height: 0.95; letter-spacing: -0.05em; white-space: nowrap; }
	.tag { margin-top: 20px; font-size: 60px; font-weight: 700; letter-spacing: -0.035em; color: #1e3df5; }
	.host {
		position: absolute; left: 84px; bottom: 64px;
		display: flex; align-items: center; gap: 14px;
		font-size: 30px; font-weight: 700; letter-spacing: -0.02em; color: #545b6b;
	}
	.host img { width: 40px; height: 40px; }
	.art {
		position: absolute; right: 64px; top: 150px;
		width: 290px; height: 290px;
		filter: drop-shadow(0 36px 48px rgb(22 48 216 / 0.32)) drop-shadow(0 4px 10px rgb(11 13 18 / 0.14));
	}
</style>
</head>
<body>
	<div class="dots"></div>
	<div class="copy">
		<span class="pill"><i></i>Free PDF tools</span>
		<h1>Lock up PDFs.</h1>
		<p class="tag">Yes, both kinds.</p>
	</div>
	<p class="host"><img src="icon.svg" alt="">lockuppdfs.com</p>
	<img class="art" src="icon.svg" alt="">
</body>
</html>
