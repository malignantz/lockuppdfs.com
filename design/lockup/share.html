<!doctype html>
<!--
	LockUpPDFs link preview, 1200 x 630. Rendered to design/lockup/og.png by
	`node scripts/make-lockup-assets.mjs`, which fills the {{...}} slots: the bundled
	display face, the booking photo (src/lib/site/BookingPhoto.svelte, the same drawing
	as the start page), the mark, and the words from src/lib/site/site.ts.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Anton LockUp';
				src: url(data:font/woff2;base64,{{FONT}}) format('woff2');
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				--lk-display: 'Anton LockUp', Impact, sans-serif;
				position: relative;
				background: #f3f4f5;
				color: #111;
				font-family: system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}
			/* A thick black frame round the card, like a tabloid box. */
			body::after {
				content: '';
				position: absolute;
				inset: 0;
				border: 10px solid #111;
				pointer-events: none;
			}
			.copy {
				position: absolute;
				left: 64px;
				top: 56px;
				width: 620px;
			}
			.brand {
				display: flex;
				align-items: center;
				gap: 12px;
				font-family: var(--lk-display);
				font-size: 34px;
				letter-spacing: 0.02em;
				text-transform: uppercase;
			}
			.brand svg {
				width: 46px;
				height: 46px;
			}
			.brand b {
				font-weight: 400;
				margin-left: 3px;
				padding: 3px 8px 1px;
				background: #ff6a13;
				box-shadow: 3px 3px 0 #111;
				transform: rotate(-2deg);
			}
			h1 {
				margin-top: 30px;
				font-family: var(--lk-display);
				font-weight: 400;
				font-size: 120px;
				line-height: 0.92;
				text-transform: uppercase;
			}
			h1 span {
				display: block;
			}
			h1 .hi {
				display: inline-block;
				margin-top: 8px;
				margin-left: -6px;
				padding: 6px 16px 2px;
				background: #ff6a13;
				box-shadow: 8px 8px 0 #111;
				transform: rotate(-1.2deg);
				transform-origin: left center;
			}
			.line {
				margin-top: 40px;
				font-size: 33px;
				font-weight: 700;
				letter-spacing: -0.005em;
			}
			.host {
				position: absolute;
				left: 64px;
				bottom: 50px;
				font-family: var(--lk-display);
				font-size: 30px;
				letter-spacing: 0.06em;
				text-transform: uppercase;
			}
			.photo {
				position: absolute;
				right: 60px;
				top: 92px;
				width: 460px;
				border: 5px solid #111;
				background: #e9eaec;
				box-shadow: 12px 12px 0 #111;
				transform: rotate(1.8deg);
			}
			.photo svg {
				display: block;
				width: 100%;
				height: auto;
				font-family: var(--lk-display);
			}
		</style>
	</head>
	<body>
		<div class="copy">
			<div class="brand">{{MARK}}<span>{{WORD_A}}</span><b>{{WORD_B}}</b></div>
			<h1><span>{{HEAD_A}}</span><span class="hi">{{HEAD_B}}</span></h1>
			<p class="line">{{LINE}}</p>
		</div>
		<p class="host">lockuppdfs.com</p>
		<div class="photo">{{PHOTO}}</div>
	</body>
</html>
